<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ava – AI Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            height: 100vh;
            overflow: hidden;
        }

        /* Auth Screen */
        .auth-container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        .auth-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .auth-box h2 { margin-bottom: 10px; font-size: 24px; }
        .auth-box p { margin-bottom: 25px; color: #666; }

        /* App Layout */
        .app-layout {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #0f0f23;
            color: white;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-header h2 { font-size: 18px; margin-bottom: 12px; }
        .new-chat-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .new-chat-btn:hover { opacity: 0.9; }
        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .conversation-item {
            padding: 12px;
            margin-bottom: 5px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s;
        }
        .conversation-item:hover { background: rgba(255,255,255,0.1); }
        .conversation-item.active { background: rgba(102, 126, 234, 0.3); }
        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #667eea;
            background-size: cover;
        }
        .sign-out-btn {
            width: 100%;
            padding: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .sign-out-btn:hover { background: rgba(255,255,255,0.2); }

        /* Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }
        .chat-header {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h1 { font-size: 20px; }
        .model-selector select {
            padding: 8px 15px;
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 13px;
            cursor: pointer;
            outline: none;
        }
        .model-selector select option { background: #1a1a3e; color: white; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }
        .bot-message {
            background: white;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .error-message {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
            align-self: center;
            max-width: 90%;
            text-align: center;
        }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 15px 20px;
            background: white;
            border-radius: 18px;
            align-self: flex-start;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        .chat-input input:focus { border-color: #667eea; }
        .chat-input button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .chat-input button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .chat-input button:disabled { opacity: 0.6; cursor: not-allowed; }
        .message-time { font-size: 11px; margin-top: 5px; opacity: 0.7; }
        .user-message .message-time { text-align: right; }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-track { background: #f1f1f1; }
        .chat-messages::-webkit-scrollbar-thumb { background: #888; border-radius: 3px; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .message { max-width: 85%; }
        }
    </style>
</head>
<body>
    <!-- Auth Screen -->
    <div id="authScreen" class="auth-container">
        <div class="auth-box">
            <h2>✨ Ava</h2>
            <p>Sign in to chat with AI and save your history</p>
            <div id="clerk-sign-in"></div>
        </div>
    </div>

    <!-- App Screen -->
    <div id="appScreen" class="app-layout" style="display:none;">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>💬 Ava Chat</h2>
                <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
            </div>
            <div class="conversations-list" id="conversationsList">
                <p style="color:#999;text-align:center;margin-top:20px;">No conversations yet</p>
            </div>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar"></div>
                    <span id="userName"></span>
                </div>
                <button class="sign-out-btn" onclick="signOut()">Sign Out</button>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-container">
            <div class="chat-header">
                <h1>✨ Ava</h1>
                <div class="model-selector">
                    <select id="modelSelect" onchange="MODEL_NAME = this.value">
                        <option value="gemini-3-flash-preview" selected>Gemini 3 Flash</option>
                        <option value="gemma3:4b">Gemma 3 (4B)</option>
                        <option value="gemma3:12b">Gemma 3 (12B)</option>
                        <option value="deepseek-v3.2">DeepSeek V3.2</option>
                        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                        <option value="qwen3-coder-next">Qwen 3 Coder</option>
                        <option value="kimi-k2-thinking">Kimi K2 Thinking</option>
                        <option value="mistral-large-3:675b">Mistral Large 3</option>
                        <option value="glm-5.1">GLM 5.1</option>
                        <option value="gpt-oss:20b">GPT-OSS (20B)</option>
                        <option value="nemotron-3-super">Nemotron 3 Super</option>
                        <option value="rnj-1:8b">RNJ-1 (8B)</option>
                    </select>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message bot-message">
                    Welcome to Ava! Your chats are saved automatically. Start a conversation! ✨
                    <div class="message-time">Just now</div>
                </div>
            </div>

            <div class="chat-input">
                <input type="text" id="userInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter') sendMessage()" autocomplete="off">
                <button id="sendButton" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // ----- CLERK CONFIG -----
        const CLERK_PUBLISHABLE_KEY = 'pk_test_c3F1YXJlLXdoYWxlLTQ2LmNsZXJrLmFjY291bnRzLmRldiQ';
        
        // ----- APP STATE -----
        const API_URL = '/api/chat';
        const FALLBACK_MODEL = 'gemini-3-flash-preview';
        const TINY_FALLBACK = 'gemma3:4b';
        
        let MODEL_NAME = 'gemini-3-flash-preview';
        let currentUser = null;
        let currentConversationId = null;
        let conversationHistory = [];
        let isProcessing = false;
        let clerkInstance = null;

        // ----- INITIALIZE CLERK -----
        async function initClerk() {
            clerkInstance = new Clerk(CLERK_PUBLISHABLE_KEY);
            await clerkInstance.load();
            
            if (clerkInstance.user) {
                showApp(clerkInstance.user);
            } else {
                showAuthScreen();
            }
        }

        function showAuthScreen() {
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('appScreen').style.display = 'none';
            
            if (clerkInstance) {
                clerkInstance.mountSignIn(document.getElementById('clerk-sign-in'), {
                    afterSignInUrl: '/',
                    afterSignUpUrl: '/'
                });
            }
        }

        function showApp(user) {
            currentUser = user;
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'flex';
            
            document.getElementById('userName').textContent = user.fullName || user.primaryEmailAddress?.emailAddress || 'User';
            if (user.imageUrl) {
                document.getElementById('userAvatar').style.backgroundImage = `url(${user.imageUrl})`;
            }
            
            loadConversations();
        }

        async function signOut() {
            if (clerkInstance) {
                await clerkInstance.signOut();
                currentUser = null;
                currentConversationId = null;
                conversationHistory = [];
                showAuthScreen();
            }
        }

        // ----- CHAT HISTORY -----
        async function loadConversations() {
            if (!currentUser) return;
            
            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: { 'x-user-id': currentUser.id }
                });
                
                const data = await response.json();
                const list = document.getElementById('conversationsList');
                
                if (data.conversations && data.conversations.length > 0) {
                    list.innerHTML = data.conversations.map(conv => `
                        <div class="conversation-item ${conv.id === currentConversationId ? 'active' : ''}"
                             onclick="loadConversation('${conv.id}')">
                            ${escapeHtml(conv.title || 'Untitled Chat')}
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<p style="color:#999;text-align:center;margin-top:20px;">No conversations yet</p>';
                }
            } catch (error) {
                console.error('Failed to load conversations:', error);
            }
        }

        async function loadConversation(convId) {
            if (!currentUser) return;
            
            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: {
                        'x-user-id': currentUser.id,
                        'x-conversation-id': convId
                    }
                });
                
                const data = await response.json();
                currentConversationId = convId;
                
                const chatMessages = document.getElementById('chatMessages');
                chatMessages.innerHTML = '';
                conversationHistory = [];
                
                if (data.messages) {
                    data.messages.forEach(msg => {
                        addMessage(msg.content, msg.role === 'user' ? 'user' : 'bot', new Date(msg.created_at));
                        conversationHistory.push({ role: msg.role, content: msg.content });
                    });
                }
                
                loadConversations();
                document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
            } catch (error) {
                console.error('Failed to load conversation:', error);
            }
        }

        function newChat() {
            currentConversationId = null;
            conversationHistory = [];
            document.getElementById('chatMessages').innerHTML = `
                <div class="message bot-message">
                    New chat started! Ask me anything. ✨
                    <div class="message-time">${getFormattedTime()}</div>
                </div>
            `;
            loadConversations();
        }

        // ----- MESSAGING -----
        function getFormattedTime() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function addMessage(content, type, time = new Date()) {
            const div = document.createElement('div');
            div.className = `message ${type}-message`;
            div.innerHTML = escapeHtml(content).replace(/\n/g, '<br>') + 
                `<div class="message-time">${time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>`;
            document.getElementById('chatMessages').appendChild(div);
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showTypingIndicator() {
            const div = document.createElement('div');
            div.className = 'typing-indicator';
            div.id = 'typingIndicator';
            div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            document.getElementById('chatMessages').appendChild(div);
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        async function tryModel(modelName, messages) {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: modelName,
                    messages: messages,
                    userId: currentUser?.id || null,
                    conversationId: currentConversationId
                })
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            return await response.json();
        }

        async function sendMessage() {
            const message = document.getElementById('userInput').value.trim();
            if (!message || isProcessing) return;

            document.getElementById('userInput').value = '';
            isProcessing = true;
            document.getElementById('sendButton').disabled = true;

            addMessage(message, 'user');
            conversationHistory.push({ role: 'user', content: message });
            showTypingIndicator();

            try {
                let result;
                const selectedModel = MODEL_NAME;

                // Step 1: Try selected model
                try {
                    result = await tryModel(selectedModel, conversationHistory);
                } catch (firstError) {
                    console.warn(`${selectedModel} failed, trying fallback...`);
                    
                    // Step 2: Try Gemini fallback
                    if (selectedModel !== FALLBACK_MODEL) {
                        try {
                            result = await tryModel(FALLBACK_MODEL, conversationHistory);
                            result.message.content = `⚠️ ${selectedModel} is unavailable. Here's Gemini instead:\n\n${result.message.content}`;
                        } catch (secondError) {
                            // Step 3: Try tiny fallback
                            try {
                                result = await tryModel(TINY_FALLBACK, conversationHistory);
                                result.message.content = `⚠️ Both models busy. Here's ${TINY_FALLBACK}:\n\n${result.message.content}`;
                            } catch (thirdError) {
                                throw new Error('ALL_MODELS_DOWN');
                            }
                        }
                    } else {
                        throw firstError;
                    }
                }

                removeTypingIndicator();
                const botReply = result.message?.content || "I'm not sure how to respond.";
                addMessage(botReply, 'bot');
                conversationHistory.push({ role: 'assistant', content: botReply });

                // Update conversation ID from server
                if (result.conversationId && !currentConversationId) {
                    currentConversationId = result.conversationId;
                    loadConversations();
                }

            } catch (error) {
                removeTypingIndicator();
                if (error.message === 'ALL_MODELS_DOWN') {
                    addMessage('😔 All models are currently unavailable. Please try again in a few minutes.', 'error');
                } else {
                    addMessage(`❌ Error: ${error.message}`, 'error');
                }
            } finally {
                isProcessing = false;
                document.getElementById('sendButton').disabled = false;
                document.getElementById('userInput').focus();
            }
        }

        // ----- START -----
        initClerk();
    </script>
</body>
</html>
