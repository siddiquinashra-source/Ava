<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ava – AI Assistant</title>
    <script
        async
        crossorigin="anonymous"
        data-clerk-publishable-key="pk_test_c3F1YXJlLXdoYWxlLTQ2LmNsZXJrLmFjY291bnRzLmRldiQ"
        src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
        type="text/javascript"
    ></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            height: 100vh;
            overflow: hidden;
        }

        .auth-container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .auth-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .auth-box h2 { margin-bottom: 5px; font-size: 28px; }
        .auth-box p { margin-bottom: 25px; color: #666; }
        #clerk-sign-in {
            min-height: 250px;
        }

        .app-layout {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: #0f0f23;
            color: white;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-header h2 { font-size: 18px; margin-bottom: 12px; }
        .new-chat-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .conversation-item {
            padding: 12px;
            margin-bottom: 5px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conversation-item:hover { background: rgba(255,255,255,0.1); }
        .conversation-item.active { background: rgba(102, 126, 234, 0.3); }
        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #667eea;
            background-size: cover;
        }
        .sign-out-btn {
            width: 100%;
            padding: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }
        .chat-header {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h1 { font-size: 20px; }
        .model-selector select {
            padding: 8px 15px;
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 13px;
            cursor: pointer;
            outline: none;
        }
        .model-selector select option { background: #1a1a3e; color: white; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }
        .bot-message {
            background: white;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .error-message {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
            align-self: center;
            max-width: 90%;
        }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 15px 20px;
            background: white;
            border-radius: 18px;
            align-self: flex-start;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
        }
        .chat-input input:focus { border-color: #667eea; }
        .chat-input button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .chat-input button:disabled { opacity: 0.6; cursor: not-allowed; }
        .message-time { font-size: 11px; margin-top: 5px; opacity: 0.7; }
        .user-message .message-time { text-align: right; }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-track { background: #f1f1f1; }
        .chat-messages::-webkit-scrollbar-thumb { background: #888; border-radius: 3px; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .message { max-width: 85%; }
        }
    </style>
</head>
<body>
    <div id="authScreen" class="auth-container">
        <div class="auth-box">
            <h2>✨ Ava</h2>
            <p>Sign in to start chatting</p>
            <div id="clerk-sign-in"></div>
        </div>
    </div>

    <div id="appScreen" class="app-layout" style="display:none;">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>💬 Chats</h2>
                <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
            </div>
            <div class="conversations-list" id="conversationsList">
                <p style="color:#999;text-align:center;margin-top:20px;">No conversations yet</p>
            </div>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar"></div>
                    <span id="userName"></span>
                </div>
                <button class="sign-out-btn" onclick="signOut()">Sign Out</button>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <h1>✨ Ava</h1>
                <div class="model-selector">
                    <select id="modelSelect" onchange="MODEL_NAME = this.value">
                        <option value="gemini-3-flash-preview" selected>Gemini 3 Flash</option>
                        <option value="gemma3:4b">Gemma 3 (4B)</option>
                        <option value="gemma3:12b">Gemma 3 (12B)</option>
                        <option value="deepseek-v3.2">DeepSeek V3.2</option>
                        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                        <option value="qwen3-coder-next">Qwen 3 Coder</option>
                        <option value="kimi-k2-thinking">Kimi K2 Thinking</option>
                        <option value="mistral-large-3:675b">Mistral Large 3</option>
                        <option value="glm-5.1">GLM 5.1</option>
                        <option value="gpt-oss:20b">GPT-OSS (20B)</option>
                        <option value="nemotron-3-super">Nemotron 3 Super</option>
                        <option value="rnj-1:8b">RNJ-1 (8B)</option>
                    </select>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message bot-message">
                    Welcome to Ava! Your chats are saved automatically. ✨
                    <div class="message-time">Just now</div>
                </div>
            </div>

            <div class="chat-input">
                <input type="text" id="userInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter') sendMessage()" autocomplete="off">
                <button id="sendButton" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // Wait for Clerk to load
        window.addEventListener('load', async () => {
            if (!window.Clerk) {
                document.getElementById('clerk-sign-in').innerHTML = 
                    '<p style="color:red;">Failed to load authentication. Please disable tracking prevention or try a different browser.</p>';
                return;
            }

            const clerk = window.Clerk;
            
            clerk.addListener(({ user }) => {
                if (user) {
                    currentUser = user;
                    showApp(user);
                } else {
                    currentUser = null;
                    showAuth();
                }
            });
            
            await clerk.load();
            
            if (clerk.user) {
                currentUser = clerk.user;
                showApp(clerk.user);
            } else {
                showAuth();
            }

            function showAuth() {
                document.getElementById('authScreen').style.display = 'flex';
                document.getElementById('appScreen').style.display = 'none';
                
                clerk.mountSignIn(document.getElementById('clerk-sign-in'));
            }

            function showApp(user) {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('appScreen').style.display = 'flex';
                
                const name = user.fullName || user.primaryEmailAddress?.emailAddress?.split('@')[0] || 'User';
                document.getElementById('userName').textContent = name;
                if (user.imageUrl) {
                    document.getElementById('userAvatar').style.backgroundImage = `url(${user.imageUrl})`;
                }
                
                loadConversations();
            }
        });

        // ----- APP STATE -----
        const API_URL = '/api/chat';
        const FALLBACK_MODEL = 'gemini-3-flash-preview';
        let MODEL_NAME = 'gemini-3-flash-preview';
        let currentUser = null;
        let currentConversationId = null;
        let conversationHistory = [];
        let isProcessing = false;

        async function signOut() {
            if (window.Clerk) {
                await window.Clerk.signOut();
            }
        }

        async function loadConversations() {
            if (!currentUser) return;
            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: { 'x-user-id': currentUser.id }
                });
                const data = await response.json();
                const list = document.getElementById('conversationsList');
                if (data.conversations && data.conversations.length > 0) {
                    list.innerHTML = data.conversations.map(conv => `
                        <div class="conversation-item ${conv.id === currentConversationId ? 'active' : ''}"
                             onclick="loadConversation('${conv.id}')">
                            ${escapeHtml(conv.title || 'Untitled')}
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<p style="color:#999;text-align:center;margin-top:20px;">No conversations yet</p>';
                }
            } catch (error) {
                console.error('Failed to load conversations:', error);
            }
        }

        async function loadConversation(convId) {
            if (!currentUser) return;
            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: {
                        'x-user-id': currentUser.id,
                        'x-conversation-id': convId
                    }
                });
                const data = await response.json();
                currentConversationId = convId;
                const chatMessages = document.getElementById('chatMessages');
                chatMessages.innerHTML = '';
                conversationHistory = [];
                if (data.messages) {
                    data.messages.forEach(msg => {
                        addMessage(msg.content, msg.role === 'user' ? 'user' : 'bot', new Date(msg.created_at));
                        conversationHistory.push({ role: msg.role, content: msg.content });
                    });
                }
                loadConversations();
                document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
            } catch (error) {
                console.error('Failed to load:', error);
            }
        }

        function newChat() {
            currentConversationId = null;
            conversationHistory = [];
            document.getElementById('chatMessages').innerHTML = `
                <div class="message bot-message">
                    New chat started! ✨
                    <div class="message-time">${getFormattedTime()}</div>
                </div>
            `;
            loadConversations();
        }

        function getFormattedTime() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function addMessage(content, type, time = new Date()) {
            const div = document.createElement('div');
            div.className = `message ${type}-message`;
            div.innerHTML = escapeHtml(content).replace(/\n/g, '<br>') + 
                `<div class="message-time">${time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>`;
            document.getElementById('chatMessages').appendChild(div);
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing-indicator';
            div.id = 'typingIndicator';
            div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            document.getElementById('chatMessages').appendChild(div);
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
        }

        function hideTyping() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        async function sendMessage() {
            const message = document.getElementById('userInput').value.trim();
            if (!message || isProcessing) return;

            document.getElementById('userInput').value = '';
            isProcessing = true;
            document.getElementById('sendButton').disabled = true;

            addMessage(message, 'user');
            conversationHistory.push({ role: 'user', content: message });
            showTyping();

            try {
                let result;
                const modelsToTry = [MODEL_NAME, ...(MODEL_NAME !== FALLBACK_MODEL ? [FALLBACK_MODEL] : []), 'gemma3:4b'];

                for (const model of modelsToTry) {
                    try {
                        const response = await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                model,
                                messages: conversationHistory,
                                userId: currentUser?.id || null,
                                conversationId: currentConversationId
                            })
                        });
                        if (response.ok) {
                            result = await response.json();
                            if (model !== MODEL_NAME) {
                                result.message.content = `⚠️ ${MODEL_NAME} unavailable. Using ${model}:\n\n${result.message.content}`;
                            }
                            break;
                        }
                    } catch (e) { continue; }
                }

                hideTyping();
                if (!result) throw new Error('All models down');

                const botReply = result.message?.content || "Sorry, couldn't respond.";
                addMessage(botReply, 'bot');
                conversationHistory.push({ role: 'assistant', content: botReply });

                if (result.conversationId && !currentConversationId) {
                    currentConversationId = result.conversationId;
                    loadConversations();
                }
            } catch (error) {
                hideTyping();
                addMessage('😔 All models unavailable. Please try again.', 'error');
            } finally {
                isProcessing = false;
                document.getElementById('sendButton').disabled = false;
                document.getElementById('userInput').focus();
            }
        }

        document.getElementById('userInput').focus();
    </script>
</body>
</html>
