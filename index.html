<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ava – Your AI Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .chat-container {
            width: 100%; max-width: 800px; height: 90vh; background: white; border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%); color: white; padding: 20px;
            text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .chat-header h1 { font-size: 26px; margin-bottom: 5px; }
        .chat-header p { font-size: 13px; opacity: 0.9; }
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 20px; background: #f8f9fa;
            display: flex; flex-direction: column; gap: 15px;
        }
        .message {
            max-width: 70%; padding: 12px 18px; border-radius: 18px; line-height: 1.5;
            word-wrap: break-word; animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .user-message { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; align-self: flex-end; border-bottom-right-radius: 5px; }
        .bot-message { background: white; color: #333; align-self: flex-start; border-bottom-left-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .error-message { background: #fee; color: #c33; border: 1px solid #fcc; align-self: center; max-width: 90%; }
        .typing-indicator { display: flex; gap: 4px; padding: 15px 20px; background: white; border-radius: 18px; align-self: flex-start; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .typing-dot { width: 8px; height: 8px; background: #999; border-radius: 50%; animation: typing 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-10px); } }
        .chat-input { padding: 20px; background: white; border-top: 1px solid #e0e0e0; display: flex; gap: 10px; }
        .chat-input input { flex: 1; padding: 12px 20px; border: 2px solid #e0e0e0; border-radius: 25px; font-size: 16px; outline: none; transition: border-color 0.3s; }
        .chat-input input:focus { border-color: #667eea; }
        .chat-input button { padding: 12px 25px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 25px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .chat-input button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
        .chat-input button:disabled { opacity: 0.6; cursor: not-allowed; }
        .message-time { font-size: 11px; margin-top: 5px; opacity: 0.7; }
        .user-message .message-time { text-align: right; }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-track { background: #f1f1f1; }
        .chat-messages::-webkit-scrollbar-thumb { background: #888; border-radius: 3px; }
        @media (max-width: 600px) { .message { max-width: 85%; } }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>✨ Ava – Your AI Assistant</h1>
            <p>Ava • Powered by Gemini Flash</p>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                Hi there! I'm Ava, now running on Gemini Flash. How can I help you today? ✨
                <div class="message-time">Just now</div>
            </div>
        </div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter') sendMessage()" autocomplete="off">
            <button id="sendButton" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // ----- MODEL (exact cloud name after push) -----
        const MODEL_NAME = 'gemini-3-flash-preview';

        const API_URL = '/api/chat';
       let conversationHistory = [
    {
        role: 'system',
        content: 'Your name is Ava. You are a friendly, helpful AI assistant created by Muhammad Ahmad. Never say you are Gemini or trained by Google.'
    }
];
        let isProcessing = false;

        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');

        function getFormattedTime() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function addMessage(content, type) {
            const div = document.createElement('div');
            div.className = `message ${type}-message`;
            div.innerHTML = content.replace(/\n/g, '<br>') + `<div class="message-time">${getFormattedTime()}</div>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTypingIndicator() {
            const div = document.createElement('div');
            div.className = 'typing-indicator';
            div.id = 'typingIndicator';
            div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message || isProcessing) return;

            userInput.value = '';
            isProcessing = true;
            sendButton.disabled = true;
            userInput.disabled = true;

            addMessage(message, 'user');
            conversationHistory.push({ role: 'user', content: message });
            showTypingIndicator();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: conversationHistory,
                        stream: false
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errText}`);
                }

                const data = await response.json();
                removeTypingIndicator();

                const botReply = data.message?.content || data.response || "I'm not sure how to respond to that.";
                addMessage(botReply, 'bot');
                conversationHistory.push({ role: 'assistant', content: botReply });

                if (conversationHistory.length > 20) conversationHistory = conversationHistory.slice(-20);
            } catch (error) {
                removeTypingIndicator();
                addMessage(`❌ Error: ${error.message}`, 'error');
            } finally {
                isProcessing = false;
                sendButton.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        }

        userInput.focus();
    </script>
</body>
</html>
