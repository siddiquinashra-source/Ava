<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ava – AI Assistant</title>
    
    <!-- Highlight.js for code syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            height: 100vh;
            overflow: hidden;
        }

        /* Auth Screen */
        .auth-container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .auth-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .auth-box h2 { margin-bottom: 5px; font-size: 28px; }
        .auth-box p { margin-bottom: 20px; color: #666; font-size: 14px; }
        
        .auth-input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        .auth-input:focus { border-color: #667eea; }
        
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            transition: opacity 0.3s;
        }
        .auth-btn:hover { opacity: 0.9; }
        .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .auth-link {
            color: #667eea;
            cursor: pointer;
            font-size: 14px;
            background: none;
            border: none;
            text-decoration: underline;
        }
        .auth-link:hover { color: #764ba2; }
        
        .auth-error {
            color: #e53e3e;
            font-size: 13px;
            margin-bottom: 10px;
            display: none;
            padding: 8px;
            background: #fee;
            border-radius: 8px;
        }

        /* App Layout */
        .app-layout { display: flex; height: 100vh; }
        
        .sidebar {
            width: 280px;
            background: #0f0f23;
            color: white;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-header h2 { font-size: 18px; margin-bottom: 12px; }
        .new-chat-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .new-chat-btn:hover { opacity: 0.9; }
        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .conversation-item {
            padding: 12px;
            margin-bottom: 5px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s;
        }
        .conversation-item:hover { background: rgba(255,255,255,0.1); }
        .conversation-item.active { background: rgba(102, 126, 234, 0.3); }
        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }
        .sign-out-btn {
            width: 100%;
            padding: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .sign-out-btn:hover { background: rgba(255,255,255,0.2); }

        /* Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }
        .chat-header {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h1 { font-size: 20px; }
        .model-selector select {
            padding: 8px 15px;
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 13px;
            cursor: pointer;
            outline: none;
        }
        .model-selector select option { background: #1a1a3e; color: white; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }
        .bot-message {
            background: white;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .error-message {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
            align-self: center;
            max-width: 90%;
        }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 15px 20px;
            background: white;
            border-radius: 18px;
            align-self: flex-start;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        .chat-input input:focus { border-color: #667eea; }
        .chat-input button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .chat-input button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .chat-input button:disabled { opacity: 0.6; cursor: not-allowed; }
        .message-time { font-size: 11px; margin-top: 5px; opacity: 0.7; }
        .user-message .message-time { text-align: right; }

        /* Code Block Styles */
        .message pre {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 0;
            margin: 10px 0;
            overflow-x: auto;
            position: relative;
        }
        .message pre code {
            font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
            padding: 15px;
            display: block;
        }
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f0f23;
            padding: 8px 15px;
            border-radius: 10px 10px 0 0;
            font-size: 12px;
            color: #999;
        }
        .copy-btn {
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            transition: background 0.2s;
        }
        .copy-btn:hover { background: rgba(255,255,255,0.2); }
        
        .message code:not(pre code) {
            background: rgba(0,0,0,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', monospace;
            font-size: 0.9em;
        }

        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-track { background: #f1f1f1; }
        .chat-messages::-webkit-scrollbar-thumb { background: #888; border-radius: 3px; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .message { max-width: 85%; }
        }
    </style>
</head>
<body>
    <!-- Auth Screen -->
    <div id="authScreen" class="auth-container">
        <div class="auth-box" id="authBox">
            <div id="loginForm">
                <h2>✨ Welcome Back</h2>
                <p>Sign in to continue chatting with Ava</p>
                <div class="auth-error" id="loginError"></div>
                <input type="email" class="auth-input" id="loginEmail" placeholder="Email address" autocomplete="email">
                <input type="password" class="auth-input" id="loginPassword" placeholder="Password" autocomplete="current-password">
                <button class="auth-btn" id="loginBtn" onclick="handleLogin()">Sign In</button>
                <p style="font-size:14px; color:#666;">
                    Don't have an account? 
                    <button class="auth-link" onclick="showSignup()">Sign up</button>
                </p>
            </div>
            
            <div id="signupForm" style="display:none;">
                <h2>✨ Create Account</h2>
                <p>Join Ava and save your chats</p>
                <div class="auth-error" id="signupError"></div>
                <input type="text" class="auth-input" id="signupName" placeholder="Your name">
                <input type="email" class="auth-input" id="signupEmail" placeholder="Email address" autocomplete="email">
                <input type="password" class="auth-input" id="signupPassword" placeholder="Password (min 8 characters)" autocomplete="new-password">
                <button class="auth-btn" id="signupBtn" onclick="handleSignup()">Create Account</button>
                <p style="font-size:14px; color:#666;">
                    Already have an account? 
                    <button class="auth-link" onclick="showLogin()">Sign in</button>
                </p>
            </div>
        </div>
    </div>

    <!-- App Screen -->
    <div id="appScreen" class="app-layout" style="display:none;">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>💬 Chats</h2>
                <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
            </div>
            <div class="conversations-list" id="conversationsList">
                <p style="color:#999;text-align:center;margin-top:20px;">No conversations yet</p>
            </div>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar"></div>
                    <span id="userName"></span>
                </div>
                <button class="sign-out-btn" onclick="handleSignOut()">Sign Out</button>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <h1>✨ Ava</h1>
                <div class="model-selector">
                    <select id="modelSelect" onchange="MODEL_NAME = this.value">
                        <option value="gemini-3-flash-preview" selected>Gemini 3 Flash</option>
                        <option value="gemma3:4b">Gemma 3 (4B)</option>
                        <option value="gemma3:12b">Gemma 3 (12B)</option>
                        <option value="deepseek-v3.2">DeepSeek V3.2</option>
                        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                        <option value="qwen3-coder-next">Qwen 3 Coder</option>
                        <option value="kimi-k2-thinking">Kimi K2 Thinking</option>
                        <option value="mistral-large-3:675b">Mistral Large 3</option>
                        <option value="glm-5.1">GLM 5.1</option>
                        <option value="gpt-oss:20b">GPT-OSS (20B)</option>
                        <option value="nemotron-3-super">Nemotron 3 Super</option>
                    </select>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message bot-message">
                    Welcome to Ava! Your chats are saved automatically. ✨
                    <div class="message-time">Just now</div>
                </div>
            </div>

            <div class="chat-input">
                <input type="text" id="userInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter') sendMessage()" autocomplete="off">
                <button id="sendButton" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // ----- CONFIG -----
        const API_URL = '/api/chat';
        const AUTH_URL = '/api/auth';
        const FALLBACK_MODEL = 'gemini-3-flash-preview';
        let MODEL_NAME = 'gemini-3-flash-preview';
        
        // ----- STATE -----
        let currentUser = null;
        let currentConversationId = null;
        let conversationHistory = [];
        let isProcessing = false;

        // ----- GET USER DISPLAY NAME -----
        function getUserName() {
            if (!currentUser) return 'there';
            return currentUser.name || currentUser.email?.split('@')[0] || 'there';
        }

        // ----- AUTH UI HELPERS -----
        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('signupForm').style.display = 'none';
            clearErrors();
        }

        function showSignup() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('signupForm').style.display = 'block';
            clearErrors();
        }

        function clearErrors() {
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('signupError').style.display = 'none';
        }

        function showError(type, message) {
            const el = document.getElementById(type + 'Error');
            el.textContent = message;
            el.style.display = 'block';
        }

        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            btn.disabled = loading;
            btn.textContent = loading ? 'Please wait...' : (btnId === 'loginBtn' ? 'Sign In' : 'Create Account');
        }

        function getToken() {
            const saved = localStorage.getItem('ava_session');
            if (!saved) return null;
            try {
                return JSON.parse(saved).access_token;
            } catch (e) {
                return null;
            }
        }

        // ----- AUTH ACTIONS (using query parameters) -----
        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showError('login', 'Please fill in all fields');
                return;
            }

            setLoading('loginBtn', true);
            clearErrors();

            try {
                const response = await fetch(AUTH_URL + '?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Invalid email or password');
                }

                currentUser = data.user;
                localStorage.setItem('ava_session', JSON.stringify(data.session));
                showApp();
            } catch (error) {
                showError('login', error.message);
            } finally {
                setLoading('loginBtn', false);
            }
        }

        async function handleSignup() {
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;

            if (!name || !email || !password) {
                showError('signup', 'Please fill in all fields');
                return;
            }

            if (password.length < 8) {
                showError('signup', 'Password must be at least 8 characters');
                return;
            }

            setLoading('signupBtn', true);
            clearErrors();

            try {
                const response = await fetch(AUTH_URL + '?action=signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Signup failed');
                }

                currentUser = data.user;
                localStorage.setItem('ava_session', JSON.stringify(data.session));
                showApp();
            } catch (error) {
                showError('signup', error.message);
            } finally {
                setLoading('signupBtn', false);
            }
        }

        async function handleSignOut() {
            const token = getToken();
            if (token) {
                try {
                    await fetch(AUTH_URL + '?action=logout', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                } catch (e) { /* ignore */ }
            }

            currentUser = null;
            currentConversationId = null;
            conversationHistory = [];
            localStorage.removeItem('ava_session');

            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('appScreen').style.display = 'none';
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPassword').value = '';
            showLogin();
        }

        async function checkSession() {
            const saved = localStorage.getItem('ava_session');
            if (!saved) return false;

            try {
                const session = JSON.parse(saved);
                const response = await fetch(AUTH_URL + '?action=verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ access_token: session.access_token })
                });

                const data = await response.json();
                if (data.user) {
                    currentUser = data.user;
                    showApp();
                    return true;
                }
            } catch (e) {
                localStorage.removeItem('ava_session');
            }
            return false;
        }

        // ----- SHOW APP -----
        function showApp() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'flex';

            const name = getUserName();
            document.getElementById('userName').textContent = name;
            document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();

            // Personalized welcome
            document.getElementById('chatMessages').innerHTML = `
                <div class="message bot-message">
                    Welcome back, ${escapeHtml(name)}! How can I help you today? ✨
                    <div class="message-time">${getFormattedTime()}</div>
                </div>
            `;
            
            conversationHistory = [];
            currentConversationId = null;
            loadConversations();
        }

        // ----- CHAT HISTORY -----
        async function loadConversations() {
            if (!currentUser) return;
            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: {
                        'x-user-id': currentUser.id,
                        'Authorization': 'Bearer ' + getToken()
                    }
                });

                const data = await response.json();
                const list = document.getElementById('conversationsList');

                if (data.conversations && data.conversations.length > 0) {
                    list.innerHTML = data.conversations.map(conv => `
                        <div class="conversation-item ${conv.id === currentConversationId ? 'active' : ''}"
                             onclick="loadConversation('${conv.id}')">
                            ${escapeHtml(conv.title || 'Untitled')}
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<p style="color:#999;text-align:center;margin-top:20px;">No conversations yet</p>';
                }
            } catch (error) {
                console.error('Failed to load conversations:', error);
            }
        }

        async function loadConversation(convId) {
            if (!currentUser) return;
            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: {
                        'x-user-id': currentUser.id,
                        'x-conversation-id': convId,
                        'Authorization': 'Bearer ' + getToken()
                    }
                });

                const data = await response.json();
                currentConversationId = convId;

                const chatMessages = document.getElementById('chatMessages');
                chatMessages.innerHTML = '';
                conversationHistory = [];

                if (data.messages) {
                    data.messages.forEach(msg => {
                        addMessage(msg.content, msg.role === 'user' ? 'user' : 'bot', new Date(msg.created_at));
                        conversationHistory.push({ role: msg.role, content: msg.content });
                    });
                }

                loadConversations();
                document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
            } catch (error) {
                console.error('Failed to load:', error);
            }
        }

        function newChat() {
            currentConversationId = null;
            conversationHistory = [];
            const name = getUserName();
            document.getElementById('chatMessages').innerHTML = `
                <div class="message bot-message">
                    New chat started, ${escapeHtml(name)}! What can I help with? ✨
                    <div class="message-time">${getFormattedTime()}</div>
                </div>
            `;
            loadConversations();
        }

        // ----- MESSAGING -----
        function getFormattedTime() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addCopyButtons() {
            document.querySelectorAll('.message pre').forEach(pre => {
                if (pre.querySelector('.code-header')) return;
                
                const header = document.createElement('div');
                header.className = 'code-header';
                
                const lang = pre.querySelector('code')?.className?.replace('language-', '') || 'code';
                header.innerHTML = `<span>${lang}</span>`;
                
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.textContent = '📋 Copy';
                copyBtn.onclick = function() {
                    const code = pre.querySelector('code').textContent;
                    navigator.clipboard.writeText(code).then(() => {
                        copyBtn.textContent = '✅ Copied!';
                        setTimeout(() => copyBtn.textContent = '📋 Copy', 2000);
                    });
                };
                
                header.appendChild(copyBtn);
                pre.insertBefore(header, pre.firstChild);
            });
        }

        function addMessage(content, type, time = new Date()) {
            const div = document.createElement('div');
            div.className = `message ${type}-message`;
            
            // Process code blocks
            let processed = content
                .replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
                    const language = lang || 'plaintext';
                    return `<pre><code class="language-${language}">${escapeHtml(code.trim())}</code></pre>`;
                })
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\n/g, '<br>');
            
            div.innerHTML = processed + 
                `<div class="message-time">${time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>`;
            
            document.getElementById('chatMessages').appendChild(div);
            
            // Highlight code
            div.querySelectorAll('pre code').forEach(block => {
                hljs.highlightElement(block);
            });
            
            // Add copy buttons
            addCopyButtons();
            
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing-indicator';
            div.id = 'typingIndicator';
            div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            document.getElementById('chatMessages').appendChild(div);
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
        }

        function hideTyping() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        async function sendMessage() {
            const message = document.getElementById('userInput').value.trim();
            if (!message || isProcessing) return;

            document.getElementById('userInput').value = '';
            isProcessing = true;
            document.getElementById('sendButton').disabled = true;

            addMessage(message, 'user');
            
            const userName = getUserName();
            
            // Add system context about the user (only once per conversation)
            if (conversationHistory.length === 0 && currentUser) {
                conversationHistory.push({
                    role: 'system',
                    content: `The user's name is ${userName}. Use their name sparingly — only in greetings, goodbyes, or when it feels natural. Never use their name in every message.`
                });
            }
            
            conversationHistory.push({ role: 'user', content: message });
            showTyping();

            try {
                let result;
                const modelsToTry = [MODEL_NAME, ...(MODEL_NAME !== FALLBACK_MODEL ? [FALLBACK_MODEL] : []), 'gemma3:4b'];

                for (const model of modelsToTry) {
                    try {
                        const response = await fetch(API_URL, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + getToken()
                            },
                            body: JSON.stringify({
                                model,
                                messages: conversationHistory,
                                userId: currentUser?.id || null,
                                conversationId: currentConversationId
                            })
                        });

                        if (response.ok) {
                            result = await response.json();
                            if (model !== MODEL_NAME) {
                                result.message.content = `⚠️ ${MODEL_NAME} unavailable. Using ${model}:\n\n${result.message.content}`;
                            }
                            break;
                        }
                    } catch (e) { continue; }
                }

                hideTyping();
                if (!result) throw new Error('All models down');

                const botReply = result.message?.content || "Sorry, couldn't respond.";
                addMessage(botReply, 'bot');
                conversationHistory.push({ role: 'assistant', content: botReply });

                if (result.conversationId && !currentConversationId) {
                    currentConversationId = result.conversationId;
                    loadConversations();
                }
            } catch (error) {
                hideTyping();
                addMessage('😔 All models unavailable. Please try again.', 'error');
            } finally {
                isProcessing = false;
                document.getElementById('sendButton').disabled = false;
                document.getElementById('userInput').focus();
            }
        }

        // ----- INIT -----
        async function init() {
            const hasSession = await checkSession();
            if (!hasSession) {
                document.getElementById('authScreen').style.display = 'flex';
                document.getElementById('appScreen').style.display = 'none';
                showLogin();
            }
            document.getElementById('userInput')?.focus();
        }

        init();
    </script>
</body>
</html>
